name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Ruff
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORTER=github-check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORTER=github-pr-review
          fi
          ruff check --output-format=rdjson . | reviewdog -f=rdjson -name=ruff -reporter="$REPORTER" -fail-level=error

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --junitxml=pytest-results.xml --cov=app --cov-report=xml --cov-report=term-missing

      - name: Publish test results (checks)
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pytest-results.xml
          comment_mode: "off"

      - name: Coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "90 95"
          fail_below_min: true

      - name: Build combined PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests = int(suite.get("tests", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          duration = float(suite.get("time", 0))
          passed = tests - failures - errors - skipped
          status = "✅ Passed" if failures == 0 and errors == 0 else "❌ Failed"

          with open("combined-results.md", "w") as f:
              f.write(f"### Test Results — {status}\n\n")
              f.write(
                  f"{passed} passed, {failures} failed, {errors} errors, "
                  f"{skipped} skipped in {duration:.2f}s\n\n"
              )
              f.write(open("code-coverage-results.md").read())
          PY

      - name: Comment test results + coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: combined-results.md
