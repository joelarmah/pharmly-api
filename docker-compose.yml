services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharmly
      POSTGRES_PASSWORD: pharmly
      POSTGRES_DB: pharmly
    ports:
      - "5433:5432"
    volumes:
      - pharmly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmly"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmly:pharmly@db:5432/pharmly
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pharmly_db_data:
